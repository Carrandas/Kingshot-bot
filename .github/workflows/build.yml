name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # the Tesseract/Leptonica DLLs are LFS objects

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BotApp.sln

      - name: Build (Sonar rules and compiler warnings are errors in CI)
        run: dotnet build BotApp.sln -c Release --no-restore -warnaserror -p:NuGetAudit=false

      - name: Unit tests (with coverage)
        run: dotnet test Bot.Core.Tests -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Screenshot tests
        run: dotnet test Bot.Core.IntegrationTests -c Release --no-build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
